name: Análisis diario

on:
  schedule:
    # 22:00 UTC = 16:00 CDMX: la BMV ya cerró (cierra a las 14:00 o 15:00 según el horario de verano de EE. UU.)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analisis-diario
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar y guardar el análisis del día
        run: python analisis_diario.py
      - name: Publicar archivos (Vercel se actualiza solo con el push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data
          git diff --cached --quiet || git commit -m "Análisis diario $(TZ=America/Mexico_City date '+%Y-%m-%d')"
          git push
