name: Análisis diario

on:
  schedule:
    # 22:00 UTC = 16:00 CDMX: la BMV ya cerró (cierra a las 14:00 o 15:00 según el horario de verano de EE. UU.)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analisis-diario
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Actualizar datos reales de las empresas (SEC EDGAR)
        run: python actualizar_fichas.py
        continue-on-error: true
      - name: Generar y guardar el análisis del día
        run: python analisis_diario.py
      - name: Publicar archivos (Vercel se actualiza solo con el push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data
          git diff --cached --quiet || git commit -m "Análisis diario $(TZ=America/Mexico_City date '+%Y-%m-%d')"
          git push
